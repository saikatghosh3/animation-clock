<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-blue:   #123a8a;
    --white:     #ffffff;
    --accent:    #ee6311;
    --accent-glow: rgba(238,99,17,0.65);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
  }

  body{
    background:var(--bg-blue);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    font-family:'Poppins', Arial, sans-serif;
  }

  .stage{
    position:relative;
    width:min(92vmin, 560px);
    aspect-ratio:1/1;
    container-type:inline-size;
  }

  .dial{
    position:absolute;
    inset:0;
    transition:opacity .45s ease, transform .45s ease;
  }

  .dial.hidden{
    opacity:0;
    transform:scale(.92);
    pointer-events:none;
  }

  .tick-group{
    position:absolute;
    inset:0;
    transform-origin:71.36% 63.67%;
    will-change:transform;
    transition:transform .65s ease-in-out;
  }

  .tick{
    position:absolute;
    width:3.6cqw;
    height:7.4cqw;
    min-width:6px;
    min-height:14px;
    background:var(--white);
    border-radius:999px;
    transform-origin:center;
    opacity:1;
    transform:translate(-50%,-50%) rotate(var(--rot));
  }

  .tick.last-tick{
    background:var(--accent);
    box-shadow:0 0 12px 2px var(--accent-glow);
  }

  .tick.vanish{
    animation:vanish .65s ease-in forwards;
  }

  .tick.last-tick.vanish{
    animation:vanish-last .65s ease-in forwards;
  }

  @keyframes vanish{
    0%{
      opacity:1;
      transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) rotate(var(--rot)) scale(0);
    }
  }

  @keyframes vanish-last{
    0%{
      opacity:1;
      transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);
    }
    100%{
      opacity:0;
      transform:translate(-50%,-50%) rotate(var(--rot)) scale(0);
    }
  }

  .ball-pos{
    position:absolute;
    left:31.6%;
    top:74.5%;
    transform:translate(-50%,-50%);
  }

  .ball{
    width:7.6cqw;
    height:7.6cqw;
    min-width:16px;
    min-height:16px;
    background:var(--white);
    border-radius:50%;
    transform-origin:center bottom;
    animation:bounce 1s cubic-bezier(.5,0,.6,1) infinite;
  }

  @keyframes bounce{
    0%   { transform:translateY(0)     scale(1, .8); }
    8%   { transform:translateY(0)     scale(1.15, .8); }
    22%  { transform:translateY(-92%)  scale(.92,1.08); }
    45%  { transform:translateY(-118%) scale(1,1); }
    68%  { transform:translateY(-92%)  scale(.92,1.08); }
    92%  { transform:translateY(0)     scale(1.15,.8); }
    100% { transform:translateY(0)     scale(1,.8); }
  }

  .count-wrap{
    position:absolute;
    left:71.6%;
    top:61.4%;
    transform:translate(-50%,-50%);
    line-height:1;
  }

  .count{
    display:inline-block;
    font-weight:800;
    font-size:20cqw;
    color:var(--white);
    line-height:1;
    animation:pop .38s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes pop{
    0%{   opacity:0; transform:scale(.55); }
    60%{  opacity:1; transform:scale(1.12); }
    100%{ opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="dial" id="dial">
      <div class="tick-group" id="tickGroup"></div>
      <div class="ball-pos"><div class="ball"></div></div>
      <div class="count-wrap">
        <span class="count" id="count">7</span>
      </div>
    </div>
  </div>

<script>
  const TICK_ANGLES = [-195, -165, -135, -105, -75, -45, -15];
  const CENTER_X = 71.36;
  const CENTER_Y = 63.67;
  const RADIUS   = 52.17;
  const TICK_SPACING = 30;

  const dial      = document.getElementById('dial');
  const countEl   = document.getElementById('count');
  const tickGroup = document.getElementById('tickGroup');
  const ballEl    = document.querySelector('.ball');

  const ticks = TICK_ANGLES.map(a => {
    const rad = a * Math.PI / 180;
    const x = CENTER_X + RADIUS * Math.cos(rad);
    const y = CENTER_Y + RADIUS * Math.sin(rad);
    const rot = a + 90;

    const el = document.createElement('div');
    el.className = 'tick';
    el.style.left = x + '%';
    el.style.top  = y + '%';
    el.style.setProperty('--rot', rot + 'deg');
    tickGroup.appendChild(el);
    return el;
  });

  ticks[ticks.length - 1].classList.add('last-tick');

  const NUMBERS    = [7, 6, 5, 4, 3, 2, 1];
  const STEP_MS    = 1000;
  const END_PAUSE  = 1100;

  let idx = 0;
  let cumulativeRotation = 0;

  function showNumber(n){
    countEl.textContent = n;
    countEl.style.animation = 'none';
    ballEl.style.animation = 'none';
    void countEl.offsetWidth;
    countEl.style.animation = '';
    ballEl.style.animation = '';
  }

  function resetTicks(){
    ticks.forEach(t => t.classList.remove('vanish'));
    cumulativeRotation = 0;
    tickGroup.style.transition = 'none';
    tickGroup.style.transform = 'rotate(0deg)';
    void tickGroup.offsetWidth;
    tickGroup.style.transition = '';
  }

  function step(){
    const n = NUMBERS[idx];
    showNumber(n);

    if (n <= 7) {
      const tickIndex = 7 - n;
      cumulativeRotation = tickIndex * TICK_SPACING;

      tickGroup.style.transform = `rotate(${-cumulativeRotation}deg)`;
      ticks[tickIndex].classList.add('vanish');
    }

    idx += 1;

    if (idx < NUMBERS.length) {
      setTimeout(step, STEP_MS);
    } else {
      setTimeout(() => {
        dial.classList.add('hidden');
        setTimeout(() => {
          resetTicks();
          idx = 0;
          dial.classList.remove('hidden');
          setTimeout(step, 50);
        }, END_PAUSE);
      }, STEP_MS);
    }
  }

  setTimeout(step, 50);
</script>

</body>
</html>
